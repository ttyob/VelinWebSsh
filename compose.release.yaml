services:
  velin:
    image: ${VELIN_IMAGE:-ghcr.io/ttyob/velinwebssh:latest}
    container_name: velin
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "port=$${VELIN_ADDR##*:}; wget -q -O - \"http://127.0.0.1:$${port}/api/health/ready\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      VELIN_ADDR: ${VELIN_ADDR:-0.0.0.0:8377}
      VELIN_ADMIN_USER: ${VELIN_ADMIN_USER:-admin}
      VELIN_ADMIN_PASSWORD: ${VELIN_ADMIN_PASSWORD:-}
      VELIN_COOKIE_SECURE: ${VELIN_COOKIE_SECURE:-false}
      VELIN_HOST_PORT_ADDR: ${VELIN_HOST_PORT_ADDR:-127.0.0.1}
    volumes:
      - ./data:/app/data
