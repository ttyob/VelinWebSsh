services:
  velin:
    build:
      context: .
      network: host
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8377/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      VELIN_ADDR: ${VELIN_ADDR:-0.0.0.0:8377}
      VELIN_ADMIN_USER: ${VELIN_ADMIN_USER:-admin}
      VELIN_ADMIN_PASSWORD: ${VELIN_ADMIN_PASSWORD:-}
      VELIN_COOKIE_SECURE: ${VELIN_COOKIE_SECURE:-false}
      VELIN_HOST_PORT_ADDR: ${VELIN_HOST_PORT_ADDR:-127.0.0.1}
      VELIN_AI_BASE_URL: ${VELIN_AI_BASE_URL:-}
      VELIN_AI_MODEL: ${VELIN_AI_MODEL:-}
      VELIN_AI_API_KEY: ${VELIN_AI_API_KEY:-}
      VELIN_CRUSH_BINARY: ${VELIN_CRUSH_BINARY:-/usr/local/bin/crush}
      VELIN_CRUSH_DATA_DIR: ${VELIN_CRUSH_DATA_DIR:-/app/data/crush}
    volumes:
      - ./data:/app/data
