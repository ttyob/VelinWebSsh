name: Build and publish container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.4"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test backend
        run: go test ./...
      - name: Vet backend
        run: go vet ./...
      - name: Test and build frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ttyob/velinwebssh
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Velin Web SSH
            org.opencontainers.image.description=Self-hosted browser SSH workspace
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows-desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.4"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        shell: bash
        run: |
          npm ci
          npm run build
      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Build Windows desktop application
        shell: pwsh
        run: |
          $env:Path = "$(go env GOPATH)\bin;$env:Path"
          wails.exe build -platform windows/amd64 -clean -m -s -skipbindings
      - name: Package Windows desktop release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/velin-windows-gui-amd64/web | Out-Null
          Copy-Item build/bin/Velin-GUI.exe release/velin-windows-gui-amd64/Velin-GUI.exe
          Copy-Item -Recurse web/dist release/velin-windows-gui-amd64/web/dist
          Copy-Item desktop/.env.example release/velin-windows-gui-amd64/.env.example
          Compress-Archive -Path release/velin-windows-gui-amd64 -DestinationPath release/velin-windows-gui-amd64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-release
          path: release/velin-windows-gui-amd64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.4"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: windows-desktop-release
          path: release
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for arch in amd64 arm64; do
            package="velin-linux-web-${arch}"
            mkdir -p "release/${package}/web"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build \
              -trimpath -ldflags="-s -w" -o "release/${package}/velin-web" ./cmd/velin
            cp -R web/dist "release/${package}/web/dist"
            cp .env.example README.md "release/${package}/"
            tar -C release -czf "release/${package}.tar.gz" "${package}"
          done
          cd release
          sha256sum velin-linux-*.tar.gz velin-windows-*.zip > checksums.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/velin-linux-web-amd64.tar.gz
            release/velin-linux-web-arm64.tar.gz
            release/velin-windows-gui-amd64.zip
            release/checksums.txt
