services:
  rdp-drives-init:
    image: alpine:3.22
    user: "0:0"
    restart: "no"
    command: ["/bin/sh", "-c", "mkdir -p /tmp/velin-rdp-drives && chmod 0777 /tmp/velin-rdp-drives"]
    volumes:
      - "${TRIM_PKGTMP}/rdp-drives:/tmp/velin-rdp-drives"

  guacd:
    image: guacamole/guacd:1.6.0
    container_name: velin-fnos-guacd
    network_mode: host
    restart: unless-stopped
    depends_on:
      rdp-drives-init:
        condition: service_completed_successfully
    volumes:
      - "${TRIM_PKGTMP}/rdp-drives:/tmp/velin-rdp-drives"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4822"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s

  velin:
    image: ghcr.io/ttyob/velinwebssh:latest
    container_name: velin-fnos
    user: "${TRIM_UID:-1000}:${TRIM_GID:-1000}"
    network_mode: host
    restart: unless-stopped
    depends_on:
      guacd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "port=$${VELIN_ADDR##*:}; wget -q -O - \"http://127.0.0.1:$${port}/api/health/ready\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      VELIN_ADDR: "0.0.0.0:${TRIM_SERVICE_PORT:-8377}"
      VELIN_DATA_DIR: /app/data
      VELIN_WEB_DIST: /app/web/dist
      VELIN_ADMIN_USER: "${wizard_admin_user:-admin}"
      VELIN_ADMIN_PASSWORD: "${wizard_admin_password:-}"
      VELIN_COOKIE_SECURE: "${wizard_cookie_secure:-false}"
      VELIN_HOST_PORT_ADDR: 127.0.0.1
      VELIN_GUACD_ADDR: 127.0.0.1:4822
      VELIN_DESKTOP_PROXY_ADDR: 127.0.0.1
      VELIN_AI_BASE_URL: "${wizard_ai_base_url:-}"
      VELIN_AI_MODEL: "${wizard_ai_model:-}"
      VELIN_AI_API_KEY: "${wizard_ai_api_key:-}"
      VELIN_CRUSH_BINARY: /usr/local/bin/crush
      VELIN_CRUSH_DATA_DIR: /app/data/crush
      VELIN_RDP_DRIVE_DIR: /tmp/velin-rdp-drives
    volumes:
      - "${TRIM_PKGVAR}/data:/app/data"
      - "${TRIM_PKGTMP}/rdp-drives:/tmp/velin-rdp-drives"
